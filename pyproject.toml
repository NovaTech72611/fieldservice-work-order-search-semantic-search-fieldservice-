[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fieldservice-work-order-search"
version = "0.1.0"
description = "Semantic search service for field-service work orders"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "openai>=1.40,<2",
  "pydantic>=2.8,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.2,<9"]

[tool.hatch.build.targets.wheel]
packages = ["src/fieldservice_search"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

